name: SheetApp2 Quality Gate & Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: PHP Lint & Security Regression Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, json, openssl, ctype, fileinfo, zip, curl, dom
          coverage: none

      - name: Check PHP & Extensions
        run: |
          php -v
          php -m

      - name: Install sanitized library for a fresh checkout
        run: openssl rand -hex 24 | php tools/install_library.php --password-stdin

      - name: Start isolated Apache for HTTP and gzip regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3
          ci_user="$(id -un)"
          ci_group="$(id -gn)"
          sudo sed -i "s/^export APACHE_RUN_USER=.*/export APACHE_RUN_USER=$ci_user/" /etc/apache2/envvars
          sudo sed -i "s/^export APACHE_RUN_GROUP=.*/export APACHE_RUN_GROUP=$ci_group/" /etc/apache2/envvars
          sudo tee /etc/apache2/conf-available/sheetapp-ci.conf > /dev/null <<EOF
          ServerName localhost
          Alias /sheetapp2 "$GITHUB_WORKSPACE"
          <Directory "$GITHUB_WORKSPACE">
              Options FollowSymLinks
              AllowOverride All
              Require all granted
          </Directory>
          EOF
          sudo a2enmod rewrite headers expires deflate php8.3
          sudo a2enconf sheetapp-ci
          sudo service apache2 restart
          curl --fail --silent http://localhost/sheetapp2/api/index.php?route=categories > /dev/null
          blocked_status="$(curl --silent -o /dev/null -w '%{http_code}' http://localhost/sheetapp2/api/core/Auth.php)"
          echo "Private backend HTTP status: $blocked_status"
          test "$blocked_status" = 403

      - name: Run Unified Test Runner
        env:
          SHEETAPP_TEST_URL: http://localhost/sheetapp2
        run: php tests/run_all_tests.php
